name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore

      # The library and the tools have no warnings, and they should stay so
      - name: Build (warnings are errors)
        run: |
          dotnet build src/Promptuarium/Promptuarium.csproj --no-restore -c Release -warnaserror
          dotnet build src/Promptuarium.Serializer/Promptuarium.Serializer.csproj --no-restore -c Release -warnaserror
          dotnet build tools/PEdit/PEdit.csproj --no-restore -c Release -warnaserror
          dotnet build tools/PStudio/PStudio.csproj --no-restore -c Release -warnaserror

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --filter "TestCategory!=Slow" --logger trx --results-directory TestResults

      # ppak and ppakz pack a directory, and unpack the same directory
      - name: Run the examples
        run: |
          dotnet run --project examples/GettingStarted --no-build -c Release
          dotnet run --project examples/Configuration --no-build -c Release
          ppak() { dotnet run --project examples/PPak --no-build -c Release -- "$@"; }
          ppak pack src "$RUNNER_TEMP/src.ppak"
          ppak verify "$RUNNER_TEMP/src.ppak"
          ppak list "$RUNNER_TEMP/src.ppak"
          ppak unpack "$RUNNER_TEMP/src.ppak" "$RUNNER_TEMP/unpacked"
          diff -r src "$RUNNER_TEMP/unpacked"
          ppakz() { dotnet run --project examples/PPakZ --no-build -c Release -- "$@"; }
          ppakz pack src "$RUNNER_TEMP/src.ppakz"
          ppakz verify "$RUNNER_TEMP/src.ppakz"
          ppakz list "$RUNNER_TEMP/src.ppakz"
          ppakz unpack "$RUNNER_TEMP/src.ppakz" "$RUNNER_TEMP/unpackedz"
          diff -r src "$RUNNER_TEMP/unpackedz"
          # pxml keeps the content: the sample comes back byte for byte, other files give the same tree again
          pxml() { dotnet run --project examples/PXml --no-build -c Release -- "$@"; }
          for xml in examples/PXml/sample.xml src/Promptuarium/Promptuarium.csproj tools/PStudio/Views/MainWindow.axaml; do
            pxml pack "$xml" "$RUNNER_TEMP/first.prmt"
            pxml unpack "$RUNNER_TEMP/first.prmt" "$RUNNER_TEMP/back.xml"
            pxml pack "$RUNNER_TEMP/back.xml" "$RUNNER_TEMP/second.prmt"
            cmp "$RUNNER_TEMP/first.prmt" "$RUNNER_TEMP/second.prmt"
            if [ "$xml" = examples/PXml/sample.xml ]; then
              cmp "$xml" "$RUNNER_TEMP/back.xml"
            fi
          done

      # docs/ is generated from the XML comments, it has to follow the code
      - name: Check the API reference
        run: |
          tools/generate-docs.sh
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git status --short -- docs
            echo "::error::docs/ is not up to date: run tools/generate-docs.sh and commit it."
            exit 1
          fi

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Pack
        run: |
          for project in src/Promptuarium/Promptuarium.csproj src/Promptuarium.Serializer/Promptuarium.Serializer.csproj; do
            dotnet pack "$project" --no-build -c Release -o packages
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages


  # The API reference (docs/, checked by the build) is copied to the wiki after every push to master
  wiki:
    name: Publish the API reference to the wiki
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"
          tools/publish-wiki.sh "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "API reference of ${GITHUB_SHA::7}"
          git push -q origin HEAD

  stability:
    name: Stability tests (slow)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Test
        run: dotnet test -c Release --filter "TestCategory=Slow"
