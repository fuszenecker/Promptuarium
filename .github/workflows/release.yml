name: Release

# A new version tag (e.g. 7.1.0, or 7.1.0-beta.1 for a pre-release) creates a GitHub release
# with the NuGet packages, the symbol packages and pedit. It can also be started by hand for an existing tag.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release (e.g. 7.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # The tag must be the version of the packages (one version in src/Directory.Build.props), so the version is always bumped before tagging
      - name: Check the version
        run: |
          VERSION=$(dotnet msbuild src/Promptuarium/Promptuarium.csproj -getProperty:Version)
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::The tag ($TAG) is not the version of src/Directory.Build.props ($VERSION)."
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release --filter "TestCategory!=Slow"

      - name: Pack
        run: |
          for project in src/Promptuarium/Promptuarium.csproj src/Promptuarium.Serializer/Promptuarium.Serializer.csproj; do
            dotnet pack "$project" -c Release -o artifacts
          done

      - name: Publish pedit
        if: hashFiles('tools/PEdit/PEdit.csproj') != ''
        run: |
          dotnet publish tools/PEdit/PEdit.csproj -c Release -o publish/pedit
          (cd publish && zip -qr "../artifacts/pedit-$TAG.zip" pedit)

      - name: Publish PStudio
        if: hashFiles('tools/PStudio/PStudio.csproj') != ''
        run: |
          dotnet publish tools/PStudio/PStudio.csproj -c Release -o publish/pstudio
          (cd publish && zip -qr "../artifacts/pstudio-$TAG.zip" pstudio)

      # A pre-release (8.0.0-rc1) is 8.0.0~rc1 for Debian, so that it comes before 8.0.0
      - name: Debian packages
        run: |
          for script in tools/PEdit/packaging/build-deb.sh tools/PStudio/packaging/build-deb.sh; do
            if [ -f "$script" ]; then
              "$script" --version "${TAG/-/\~}" --output deb-build
            fi
          done
          mv deb-build/*.deb artifacts/

      - name: Release notes
        run: |
          {
            dotnet msbuild src/Promptuarium/Promptuarium.csproj -getProperty:PackageReleaseNotes
            echo
            echo "### Attachments"
            echo

            echo "- The NuGet packages (Promptuarium, Promptuarium.Serializer) and their symbol packages (upload all of them to nuget.org)."

            if [ -f "artifacts/pedit-$TAG.zip" ]; then
              echo "- pedit, the command line tool (requires .NET 10: \`dotnet pedit/pedit.dll help\`)."
            fi

            if [ -f "artifacts/pstudio-$TAG.zip" ]; then
              echo "- PStudio, the graphical editor for Windows, Linux and macOS (requires .NET 10: \`dotnet pstudio/pstudio.dll\`)."
            fi

            if ls artifacts/pedit_*.deb > /dev/null 2>&1; then
              echo "- pedit for Debian and Ubuntu (amd64, no .NET needed, with a man page): \`sudo apt install ./pedit_*.deb\`."
            fi

            if ls artifacts/pstudio_*.deb > /dev/null 2>&1; then
              echo "- PStudio for Debian and Ubuntu (amd64, no .NET needed): \`sudo apt install ./pstudio_*.deb\`. It opens the Promptuarium containers, and adds their rules to \`/etc/magic\`, so that \`file\` recognizes them."
            fi
          } > release-notes.md

      - name: Create the release
        run: |
          case "$TAG" in
            *-*) KIND=(--prerelease --latest=false) ;;
            *) KIND=(--latest) ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file release-notes.md --generate-notes --verify-tag "${KIND[@]}"
          fi
