name: Release

# A new version tag (e.g. 7.1.0, 7.1.0.1 for a packaging-only release, or 7.1.0-beta.1 for a pre-release) creates a GitHub release
# with the NuGet packages, the symbol packages, and PStudio with pedit, pcfg, ppak and ppakz: the Windows installer, the Debian package and the RPM package (built on Rocky Linux 9).
# It can also be started by hand for an existing tag.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release (e.g. 7.0.0)
        required: true

permissions:
  contents: write
  # Trusted publishing to nuget.org: the workflow gets a short-lived API key for its OIDC token
  id-token: write

jobs:
  # Only a build on Windows puts the icon and the version into pstudio.exe, so the installer is built on Windows
  windows:
    name: PStudio installer for Windows
    runs-on: windows-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -VERSION

      - name: Build the installer
        shell: pwsh
        run: tools/PStudio/packaging/windows/build-windows-installer.ps1 -Version $env:TAG -Output installer

      - uses: actions/upload-artifact@v4
        with:
          name: pstudio-windows
          path: installer/*-setup.exe
          if-no-files-found: error

  # The RPM package is built on Rocky Linux 9 (RHEL compatible) with its own rpmbuild and macros, and it is installed
  # and removed there: the dependencies, the scriptlets (/etc/magic) and the tools are tried on a real RPM system
  rpm:
    name: PStudio RPM package (Rocky Linux 9)
    runs-on: ubuntu-latest
    # The image has no PATH in its config, and the runner puts the PATH of setup-dotnet before that of the image:
    # without an explicit PATH, the later steps do not find even sh
    container:
      image: quay.io/rockylinux/rockylinux:9
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      # git for a real checkout, libicu for .NET, file for the /etc/magic of the scriptlets
      - name: Install the build tools
        run: dnf install -y -q git rpm-build gzip findutils tar libicu file

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # A pre-release (8.0.0-rc1) is 8.0.0~rc1 for RPM (the script converts it)
      - name: Build the RPM package
        run: tools/PStudio/packaging/build-rpm.sh --version "$TAG" --output rpm-build

      - name: Install, try and remove the package
        run: |
          dnf install -y -q ./rpm-build/pstudio-*.rpm
          pedit --version
          pcfg --version
          ppak --version
          ppakz --version
          grep -q '^# BEGIN pstudio' /etc/magic
          dnf remove -y -q pstudio
          if grep -q '^# BEGIN pstudio' /etc/magic; then
            echo "::error::The rules of the containers are left in /etc/magic."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pstudio-rpm
          path: rpm-build/*.rpm
          if-no-files-found: error

  release:
    name: Release
    needs: [windows, rpm]
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      # The tag must be the version of the packages (one version in src/Directory.Build.props), so the version is always bumped before tagging
      - name: Check the version
        run: |
          VERSION=$(dotnet msbuild src/Promptuarium/Promptuarium.csproj -getProperty:Version)
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::The tag ($TAG) is not the version of src/Directory.Build.props ($VERSION)."
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release --filter "TestCategory!=Slow"

      - name: Pack
        run: |
          for project in src/Promptuarium/Promptuarium.csproj src/Promptuarium.Serializer/Promptuarium.Serializer.csproj; do
            dotnet pack "$project" -c Release -o artifacts
          done

      - name: The Windows installer of PStudio
        uses: actions/download-artifact@v4
        with:
          name: pstudio-windows
          path: artifacts

      # A pre-release (8.0.0-rc1) is 8.0.0~rc1 for Debian, so that it comes before 8.0.0
      # One package for PStudio, pedit, pcfg, ppak and ppakz
      - name: Debian package
        run: |
          tools/PStudio/packaging/build-deb.sh --version "${TAG/-/\~}" --output deb-build
          mv deb-build/*.deb artifacts/

      - name: The RPM package of PStudio
        uses: actions/download-artifact@v4
        with:
          name: pstudio-rpm
          path: artifacts

      - name: Release notes
        run: |
          {
            dotnet msbuild src/Promptuarium/Promptuarium.csproj -getProperty:PackageReleaseNotes
            echo
            echo "### Attachments"
            echo

            echo "- The NuGet packages (Promptuarium, Promptuarium.Serializer) and their symbol packages (also pushed to nuget.org)."

            if [ -f "artifacts/pstudio-$TAG-win-x64-setup.exe" ]; then
              echo "- PStudio, pedit, pcfg, ppak and ppakz for Windows (x64, no .NET needed): the installer \`pstudio-$TAG-win-x64-setup.exe\` (Start Menu entries, \`.prmt\` file association, uninstall in Apps)."
            fi

            if ls artifacts/pstudio_*.deb > /dev/null 2>&1; then
              echo "- PStudio, pedit, pcfg, ppak and ppakz for Debian and Ubuntu (amd64, no .NET needed, \`man pedit\`, \`man pcfg\`, \`man ppak\`, \`man ppakz\`): \`sudo apt install ./pstudio_*.deb\`. PStudio opens the Promptuarium containers, and the rules of the containers are added to \`/etc/magic\`, so that \`file\` recognizes them. The package replaces the former pedit package."
            fi

            if ls artifacts/pstudio-*.rpm > /dev/null 2>&1; then
              echo "- PStudio, pedit, pcfg, ppak and ppakz for Fedora, RHEL and openSUSE (x86_64, no .NET needed, \`man pedit\`, \`man pcfg\`, \`man ppak\`, \`man ppakz\`): \`sudo dnf install ./pstudio-*.rpm\` (or \`sudo zypper install ./pstudio-*.rpm\`). The same as the Debian package: PStudio opens the Promptuarium containers, and \`file\` recognizes them."
            fi
          } > release-notes.md

      - name: Create the release
        run: |
          case "$TAG" in
            *-*) KIND=(--prerelease --latest=false) ;;
            *) KIND=(--latest) ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file release-notes.md --generate-notes --verify-tag "${KIND[@]}"
          fi

      # Trusted publishing: nuget.org has a policy for this repository and release.yml, NUGET_USER is the nuget.org
      # user name. The GitHub release comes first, so it is made even if the push fails; a version already on
      # nuget.org is skipped, so the workflow can be run again for a tag
      - name: Log in to nuget.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
