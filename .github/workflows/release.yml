name: Release

# A new version tag (e.g. 7.1.0, or 7.1.0-beta.1 for a pre-release) creates a GitHub release
# with the NuGet packages, the symbol packages, and PStudio with pedit: the Windows installer and the Debian package.
# It can also be started by hand for an existing tag.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release (e.g. 7.0.0)
        required: true

permissions:
  contents: write

jobs:
  # Only a build on Windows puts the icon and the version into pstudio.exe, so the installer is built on Windows
  windows:
    name: PStudio installer for Windows
    runs-on: windows-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -VERSION

      - name: Build the installer
        shell: pwsh
        run: tools/PStudio/packaging/windows/build-windows-installer.ps1 -Version $env:TAG -Output installer

      - uses: actions/upload-artifact@v4
        with:
          name: pstudio-windows
          path: installer/*-setup.exe
          if-no-files-found: error

  release:
    name: Release
    needs: windows
    runs-on: ubuntu-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      # The tag must be the version of the packages (one version in src/Directory.Build.props), so the version is always bumped before tagging
      - name: Check the version
        run: |
          VERSION=$(dotnet msbuild src/Promptuarium/Promptuarium.csproj -getProperty:Version)
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::The tag ($TAG) is not the version of src/Directory.Build.props ($VERSION)."
            exit 1
          fi

      - name: Test
        run: dotnet test -c Release --filter "TestCategory!=Slow"

      - name: Pack
        run: |
          for project in src/Promptuarium/Promptuarium.csproj src/Promptuarium.Serializer/Promptuarium.Serializer.csproj; do
            dotnet pack "$project" -c Release -o artifacts
          done

      - name: The Windows installer of PStudio
        uses: actions/download-artifact@v4
        with:
          name: pstudio-windows
          path: artifacts

      # A pre-release (8.0.0-rc1) is 8.0.0~rc1 for Debian, so that it comes before 8.0.0
      # One package for PStudio and pedit
      - name: Debian package
        run: |
          tools/PStudio/packaging/build-deb.sh --version "${TAG/-/\~}" --output deb-build
          mv deb-build/*.deb artifacts/

      - name: Release notes
        run: |
          {
            dotnet msbuild src/Promptuarium/Promptuarium.csproj -getProperty:PackageReleaseNotes
            echo
            echo "### Attachments"
            echo

            echo "- The NuGet packages (Promptuarium, Promptuarium.Serializer) and their symbol packages (upload all of them to nuget.org)."

            if [ -f "artifacts/pstudio-$TAG-win-x64-setup.exe" ]; then
              echo "- PStudio and pedit for Windows (x64, no .NET needed): the installer \`pstudio-$TAG-win-x64-setup.exe\` (Start Menu entries, \`.prmt\` file association, uninstall in Apps)."
            fi

            if ls artifacts/pstudio_*.deb > /dev/null 2>&1; then
              echo "- PStudio and pedit for Debian and Ubuntu (amd64, no .NET needed, \`man pedit\`): \`sudo apt install ./pstudio_*.deb\`. PStudio opens the Promptuarium containers, and the rules of the containers are added to \`/etc/magic\`, so that \`file\` recognizes them. The package replaces the former pedit package."
            fi
          } > release-notes.md

      - name: Create the release
        run: |
          case "$TAG" in
            *-*) KIND=(--prerelease --latest=false) ;;
            *) KIND=(--latest) ;;
          esac

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file release-notes.md --generate-notes --verify-tag "${KIND[@]}"
          fi
